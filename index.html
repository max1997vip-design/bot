<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turbo Clicker</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="app-container">
        
        <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
        <header class="top-bar">
            <div class="user-info">
                <div class="avatar">🏎️</div>
                <div class="user-details">
                    <span class="user-name" id="user-name">Пилот</span>
                    <span class="user-rank">Новичок</span>
                </div>
            </div>
            <div class="balance-card">
                <span class="coin-icon">💰</span>
                <span id="money-display">0</span>
            </div>
        </header>

        <!-- ВКЛАДКА: ГОНКА -->
        <main id="tab-race" class="tab-content active">
            <div class="track-container">
                <div class="road">
                    <div class="road-lines"></div>
                </div>
                <div id="car-container" class="car-container">
                    <img id="car-img" src="" alt="Car" class="car-image">
                </div>
                <!-- Точка появления цифр -->
                <div id="floating-texts"></div>
            </div>

            <div class="stats-grid">
                <div class="stat-box">
                    <span class="stat-label">За клик</span>
                    <span class="stat-value" id="click-power-display">+1</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">В секунду</span>
                    <span class="stat-value" id="auto-power-display">+0</span>
                </div>
            </div>

            <div class="action-area">
                <button id="nitro-btn" class="nitro-btn">
                    <span>🔥</span> НИТРО
                </button>
                <button id="click-button" class="main-click-btn">
                    <span class="click-text">ГАЗ</span>
                </button>
            </div>
        </main>

        <!-- ВКЛАДКА: ТЮНИНГ -->
        <main id="tab-upgrades" class="tab-content">
            <h2 class="section-title">ТЮНИНГ БОЛИДА</h2>
            <div class="upgrade-list">
                <div class="upgrade-card" id="upgrade-engine">
                    <div class="upgrade-icon">⚙️</div>
                    <div class="upgrade-info">
                        <h3>Двигатель</h3>
                        <p>Увеличивает доход за клик</p>
                        <div class="upgrade-stats">
                            <span>Ур. <span id="engine-level">1</span></span>
                            <span class="price" id="engine-price">10 💰</span>
                        </div>
                    </div>
                </div>
                <div class="upgrade-card" id="upgrade-turbo">
                    <div class="upgrade-icon">🌀</div>
                    <div class="upgrade-info">
                        <h3>Турбонаддув</h3>
                        <p>Приносит пассивный доход</p>
                        <div class="upgrade-stats">
                            <span>Ур. <span id="turbo-level">0</span></span>
                            <span class="price" id="turbo-price">50 💰</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- ВКЛАДКА: ГАРАЖ -->
        <main id="tab-garage" class="tab-content">
            <h2 class="section-title">МОЙ ГАРАЖ</h2>
            <div id="cars-list" class="garage-list">
                <!-- Машины генерируются в JS -->
            </div>
        </main>

        <!-- НИЖНЕЕ МЕНЮ -->
        <nav class="bottom-nav">
            <button class="nav-btn active" data-tab="race">
                <span class="nav-icon">🏁</span>
                <span class="nav-text">Гонка</span>
            </button>
            <button class="nav-btn" data-tab="upgrades">
                <span class="nav-icon">🛠️</span>
                <span class="nav-text">Тюнинг</span>
            </button>
            <button class="nav-btn" data-tab="garage">
                <span class="nav-icon">🏎️</span>
                <span class="nav-text">Гараж</span>
            </button>
            <button class="nav-btn" id="btn-leaderboard">
                <span class="nav-icon">🏆</span>
                <span class="nav-text">Топ</span>
            </button>
        </nav>
    </div>

    <!-- МОДАЛКА ЛИДЕРОВ -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content">
            <h2 class="section-title">ТОП ИГРОКОВ</h2>
            <div id="leaderboard-list" class="leader-list">Загрузка...</div>
            <button id="close-leaderboard" class="close-modal-btn">Закрыть</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
