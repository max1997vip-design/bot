<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Гоночный Кликер</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем официальную библиотеку Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <h1>Гоночный Кликер</h1>
        <div id="user-name">Привет, Игрок!</div>
        
        <!-- Трек и машинка -->
        <div id="track">
            <div id="car">🏎️</div>
        </div>

        <!-- Счетчик денег -->
        <div id="money-display">💰 0</div>
        
        <!-- Кнопка клика -->
        <button id="click-button">ГАЗ!</button>

        <!-- Магазин улучшений -->
        <div class="shop">
            <h3>Магазин улучшений</h3>
            <button id="upgrade-engine" class="shop-btn">Улучшить двигатель (Цена: 10)</button>
            <button id="upgrade-turbo" class="shop-btn">Купить турбо (Цена: 50)</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
