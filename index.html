<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Гоночный Кликер 3D</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏁 Гоночный Кликер</h1>
            <div id="user-name">Привет, Игрок!</div>
        </div>

        <!-- 3D Трасса -->
        <div class="track-view">
            <div class="road">
                <div class="road-lines"></div>
            </div>
            <img id="car-img" src="https://cdn-icons-png.flaticon.com/512/3204/3204071.png" alt="Car" class="car">
        </div>

        <div id="money-display">💰 0</div>
        <div id="click-power-hint"></div>

        <button id="click-button">ГАЗ! 🏁</button>

        <div class="shop">
            <h3>⚙️ Улучшения</h3>
            <button id="upgrade-engine" class="shop-btn"></button>
            <button id="upgrade-turbo" class="shop-btn"></button>
        </div>

        <div class="shop">
            <h3>🏎️ Гараж</h3>
            <div id="cars-list"></div>
        </div>

        <button id="leaderboard-btn" class="secondary-btn">🏆 Таблица лидеров</button>
    </div>

    <!-- Модалка лидеров -->
    <div id="leaderboard-modal" class="modal hidden">
        <div class="modal-content">
            <h2>🏆 Топ игроков</h2>
            <div id="leaderboard-list">Загрузка...</div>
            <button id="close-leaderboard" class="secondary-btn">Закрыть</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
